<svg viewBox="0 0 740 420" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, system-ui, sans-serif">

  <!-- Background -->
  <rect width="740" height="420" fill="#F0EFEB" rx="12"/>

  <!-- Title -->
  <text x="400" y="22" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2A2A28">Punto de equilibrio — clínica dental (ejemplo referencial)</text>

  <!-- Grid lines -->
  <line x1="80" y1="287" x2="680" y2="287" stroke="#ddddd8" stroke-width="1"/>
  <line x1="80" y1="213" x2="680" y2="213" stroke="#ddddd8" stroke-width="1"/>
  <line x1="80" y1="140" x2="680" y2="140" stroke="#ddddd8" stroke-width="1"/>
  <line x1="80" y1="67"  x2="680" y2="67"  stroke="#ddddd8" stroke-width="1"/>

  <!-- Loss zone -->
  <polygon points="80,360 530,140 80,250" fill="rgba(210,70,50,0.09)"/>

  <!-- Profit zone -->
  <polygon points="530,140 680,67 680,103" fill="rgba(74,124,111,0.13)"/>

  <!-- Fixed costs line (dashed) -->
  <line x1="80" y1="250" x2="680" y2="250" stroke="#9BA8A3" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Total costs line -->
  <line x1="80" y1="250" x2="680" y2="103" stroke="#2A2A28" stroke-width="2"/>

  <!-- Revenue line -->
  <line x1="80" y1="360" x2="680" y2="67" stroke="#4A7C6F" stroke-width="2.5"/>

  <!-- Breakeven vertical dashed -->
  <line x1="530" y1="140" x2="530" y2="360" stroke="#4A7C6F" stroke-width="1" stroke-dasharray="4,3" opacity="0.55"/>

  <!-- Breakeven dot -->
  <circle cx="530" cy="140" r="6" fill="#4A7C6F"/>
  <circle cx="530" cy="140" r="3" fill="white"/>

  <!-- Axes -->
  <line x1="80" y1="360" x2="685" y2="360" stroke="#2A2A28" stroke-width="1.5"/>
  <line x1="80" y1="32"  x2="80"  y2="360" stroke="#2A2A28" stroke-width="1.5"/>

  <!-- Y-axis labels -->
  <text x="73" y="364" text-anchor="end" font-size="11" fill="#6B7A76">$0</text>
  <text x="73" y="291" text-anchor="end" font-size="11" fill="#6B7A76">$1M</text>
  <text x="73" y="217" text-anchor="end" font-size="11" fill="#6B7A76">$2M</text>
  <text x="73" y="144" text-anchor="end" font-size="11" fill="#6B7A76">$3M</text>
  <text x="73" y="71"  text-anchor="end" font-size="11" fill="#6B7A76">$4M</text>

  <!-- X-axis labels -->
  <text x="80"  y="378" text-anchor="middle" font-size="11" fill="#6B7A76">0</text>
  <text x="230" y="378" text-anchor="middle" font-size="11" fill="#6B7A76">20</text>
  <text x="380" y="378" text-anchor="middle" font-size="11" fill="#6B7A76">40</text>
  <text x="530" y="378" text-anchor="middle" font-size="11" font-weight="700" fill="#4A7C6F">60</text>
  <text x="680" y="378" text-anchor="middle" font-size="11" fill="#6B7A76">80</text>

  <!-- Axis titles -->
  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#6B7A76">Tratamientos por mes</text>
  <text x="14" y="200" text-anchor="middle" font-size="11" fill="#6B7A76" transform="rotate(-90,14,200)">CLP / mes</text>

  <!-- Line labels -->
  <text x="690" y="71"  font-size="11" font-weight="600" fill="#4A7C6F">Ingresos</text>
  <text x="690" y="107" font-size="11" font-weight="500" fill="#2A2A28">Costos totales</text>
  <text x="690" y="254" font-size="11" fill="#9BA8A3">Costos fijos</text>

  <!-- Breakeven badge -->
  <rect x="544" y="126" width="80" height="22" rx="5" fill="#4A7C6F"/>
  <text x="584" y="141" text-anchor="middle" font-size="10.5" font-weight="600" fill="white">Breakeven: 60</text>

  <!-- Zone labels -->
  <text x="200" y="318" text-anchor="middle" font-size="11" fill="rgba(180,60,40,0.65)">Pérdida</text>
  <text x="625" y="112" text-anchor="middle" font-size="11" font-weight="500" fill="#4A7C6F">Utilidad</text>

  <!-- Footnote -->
  <text x="400" y="415" text-anchor="middle" font-size="9.5" fill="#aaa">Costos fijos: $1,5M CLP/mes · Ingreso por tratamiento: $50.000 CLP · Costo variable: $25.000 CLP</text>

</svg>
